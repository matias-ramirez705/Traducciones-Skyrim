[General]
$ModName$=Resaltar objetos
$SettingsLabel$=Configuración
$HLO_SectionDebug$=-- Depuración --
$DebugCheckbox$=Depuración
$DebugHelp$=Activa el registro detallado para facilitar la resolución de problemas.
$HLO_SectionStyle$=-- Estilo de resaltado --
$HLO_EnableEdgeHighlight$=Activar resaltado de contorno
$HLO_EnableEdgeHighlightHelp$=Cuando está activado, tanto el resaltado de la mira como el resaltado del radio de la tecla de acceso rápido se muestran como un contorno blanco, en lugar del resplandor dorado. Requiere Skyrim SE/AE.
$HLO_OutlineThickness$=Grosor del contorno
$HLO_OutlineThicknessHelp$=Grosor del contorno blanco (1 = fino, 20 = muy grueso). Se ajusta a la resolución de renderizado para que se vea igual a 1080p, 1440p y 4K.
$HLO_DisableEdgeRadius$=Desactivar el contorno para el resaltado del radio
$HLO_DisableEdgeRadiusHelp$=Cuando está activado, el resaltado del radio de la tecla de acceso rápido utiliza el efecto de resplandor dorado, incluso si el resaltado de contorno está activado. El resaltado de la mira (ratón) siempre utiliza el contorno.
$HLO_RedStealable$=Contorno rojo para objetos robables
$HLO_RedStealableHelp$=Cuando está activado, los objetos que supondrían un robo al recogerlos se resaltan con un contorno rojo en lugar de blanco. Solo afecta al estilo de resaltado de contorno.
$HLO_SectionRadius$=-- Resaltado del radio --
$RadiusOnlyCheckbox$=Solo resaltado del radio
$RadiusOnlyHelp$=Cuando está activado, solo funciona el sistema de resaltado del radio de la tecla de acceso rápido. Los objetos que mires normalmente dejarán de brillar.
$ScanRadiusSlider$=Radio de búsqueda
$ScanRadiusHelp$=Radio, en unidades del juego, alrededor de tu personaje para buscar objetos interactivos. Los valores más altos abarcan una zona mayor.
$HLO_SectionDuration$=-- Duración del resaltado --
$CrosshairDurationSlider$=Duración del resaltado al apuntar
$CrosshairDurationHelp$=Tiempo, en segundos, que dura el resaltado de contorno y resplandor en los objetos que miras.
$ScanDurationSlider$=Duración del resaltado del radio
$ScanDurationHelp$=Tiempo, en segundos, que dura el resaltado de contorno y resplandor en los objetos encontrados mediante el escaneo del área.
$HLO_SectionHotkeys$=-- Teclas de acceso rápido --
$KBHotkeyLabel$=Tecla de acceso rápido del teclado
$KBHotkeyHelp$=Tecla del teclado o botón del ratón que resalta todos los objetos interactivos cercanos. Establece [NONE] para desactivarlo.
$GPHotkeyLabel$=Tecla de acceso rápido del mando
$GPHotkeyHelp$=Botón del mando que resalta todos los objetos interactivos cercanos. Establece [NONE] para desactivarlo.
$HLO_SectionFilter$=-- Filtro --
$HLO_IgnoreUnnamed$=Ignorar todos los objetos sin nombre
$HLO_IgnoreUnnamedHelp$=Cuando está activado, los objetos que no tienen un nombre visible no se resaltan. Esto filtra activadores, muebles, puertas y otros objetos sin nombre.
$HLO_SectionCategories$=-- Categorías de resaltado --
$HLO_CatActivator$=Activador
$HLO_CatTalkingActivator$=Activador de diálogo
$HLO_CatContainer$=Contenedor
$HLO_CatDoor$=Puerta
$HLO_CatFlora$=Flora
$HLO_CatFurniture$=Mobiliario
$HLO_CatArmor$=Armadura
$HLO_CatWeapon$=Arma
$HLO_CatAmmo$=Munición
$HLO_CatBook$=Libro
$HLO_CatIngredient$=Ingrediente
$HLO_CatKeyMaster$=Llave
$HLO_CatMisc$=Varios
$HLO_CatAlchemyItem$=Poción / Veneno
$HLO_CatScroll$=Pergamino
$HLO_CatSoulGem$=Gema del alma