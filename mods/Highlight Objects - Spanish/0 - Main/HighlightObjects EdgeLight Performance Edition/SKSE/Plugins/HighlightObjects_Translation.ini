[General]
$ModName$=Resaltar objetos
$SettingsLabel$=Configuración
$HLO_SectionDebug$=-- Depuración --
$DebugCheckbox$=Depuración
$DebugHelp$=Activa información detallada en el registro para facilitar la resolución de problemas.
$HLO_SectionStyle$=-- Estilo de resaltado --
$HLO_EnableEdgeHighlight$=Activar resaltado de contorno
$HLO_EnableEdgeHighlightHelp$=Al activarlo, tanto el resaltado al apuntar como el resaltado por radio de la tecla de acceso rápido se mostrarán como un contorno blanco sin relleno, en lugar del resplandor dorado. Requiere Skyrim SE/AE.
$HLO_OutlineThickness$=Grosor del contorno
$HLO_OutlineThicknessHelp$=Grosor del contorno blanco (1 = fino, 20 = muy grueso). Se adapta a la resolución de renderizado para que se vea igual a 1080p, 1440p y 4K.
$HLO_EdgeOpacity$=Opacidad del contorno
$HLO_EdgeOpacityHelp$=Opacidad del contorno resaltado. 100% = totalmente visible, 0% = invisible.
$HLO_DisableEdgeRadius$=Desactivar el contorno en el resaltado por radio
$HLO_DisableEdgeRadiusHelp$=Al activarlo, el resaltado por radio de la tecla de acceso rápido utilizará el efecto de resplandor dorado aunque el resaltado de contorno esté activado. El resaltado al apuntar (con el ratón) siempre utilizará el contorno.
$HLO_RedStealable$=Contorno rojo para objetos robables
$HLO_RedStealableHelp$=Al activarlo, los objetos que supondrían un robo al cogerlos se resaltarán con un contorno rojo en lugar de blanco. Solo afecta al estilo de resaltado de contorno.
$HLO_SectionRadius$=-- Resaltado por radio --
$RadiusOnlyCheckbox$=Solo resaltado por radio
$RadiusOnlyHelp$=Al activarlo, solo funcionará el sistema de resaltado por radio de la tecla de acceso rápido. Los objetos que mires normalmente dejarán de brillar.
$ScanRadiusSlider$=Radio de búsqueda
$ScanRadiusHelp$=Radio, en unidades del juego alrededor de tu personaje, para buscar objetos interactivos. Los valores más altos abarcan una zona mayor.
$HLO_SectionDuration$=-- Duración del resaltado --
$CrosshairDurationSlider$=Duración del resaltado al apuntar
$CrosshairDurationHelp$=Tiempo, en segundos, que dura el resplandor del contorno en los objetos que miras.
$ScanDurationSlider$=Duración del resaltado por radio
$ScanDurationHelp$=Tiempo, en segundos, que dura el resplandor del contorno en los objetos encontrados durante el escaneo del área.
$HLO_SectionHotkeys$=-- Teclas de acceso rápido --
$KBHotkeyLabel$=Tecla de acceso rápido del teclado
$KBHotkeyHelp$=Tecla del teclado o botón del ratón que resalta todos los objetos interactivos cercanos. Establece [NONE] para desactivarla.
$GPHotkeyLabel$=Tecla de acceso rápido del mando
$GPHotkeyHelp$=Botón del mando que resalta todos los objetos interactivos cercanos. Establece [NONE] para desactivarla.
$HLO_SectionFilter$=-- Filtro --
$HLO_IgnoreUnnamed$=Ignorar todos los objetos sin nombre
$HLO_IgnoreUnnamedHelp$=Al activarlo, los objetos que no tengan un nombre visible no se resaltarán. Esto excluye activadores, mobiliario, puertas y otros objetos sin nombre.
$HLO_SectionCategories$=-- Categorías de resaltado --
$HLO_CatActivator$=Activador
$HLO_CatTalkingActivator$=Activador de diálogo
$HLO_CatContainer$=Contenedor
$HLO_CatDoor$=Puerta
$HLO_CatFlora$=Flora
$HLO_CatFurniture$=Mobiliario
$HLO_CatArmor$=Armadura
$HLO_CatWeapon$=Arma
$HLO_CatAmmo$=Munición
$HLO_CatBook$=Libro
$HLO_CatIngredient$=Ingrediente
$HLO_CatKeyMaster$=Llave
$HLO_CatMisc$=Varios
$HLO_CatAlchemyItem$=Poción / Veneno
$HLO_CatScroll$=Pergamino
$HLO_CatSoulGem$=Gema del alma