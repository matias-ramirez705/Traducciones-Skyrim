[General]
$HLO_ModName$=Resaltar objetos
$HLO_SettingsLabel$=Configuración

$HLO_SectionGeneral$=General
$HLO_RadiusOnlyCheckbox$=Solo resaltado por radio
$HLO_RadiusOnlyHelp$=Al activarlo, solo funcionará el sistema de resaltado por radio de la tecla de acceso rápido. Los objetos que mires normalmente dejarán de brillar.
$HLO_ScanRadiusSlider$=Radio de búsqueda
$HLO_ScanRadiusHelp$=Radio, en unidades del juego alrededor de tu personaje, para buscar objetos interactivos. Los valores más altos abarcan una zona mayor.
$HLO_ScanDurationSlider$=Duración del resaltado por radio
$HLO_ScanDurationHelp$=Tiempo, en segundos, que dura el resplandor del contorno en los objetos encontrados durante el escaneo del área.
$HLO_CrosshairDurationSlider$=Duración del resaltado al apuntar
$HLO_CrosshairDurationHelp$=Tiempo, en segundos, que dura el resplandor del contorno en los objetos que miras.
$HLO_ToggleEnabledSlider$=Activar alternancia
$HLO_ToggleEnabledHelp$=Permite que la tecla de escaneo cancele un escaneo activo antes de que termine su duración normal.
$HLO_PlayScanSuccessSoundCheckbox$=Reproducir sonido al completar el escaneo
$HLO_PlayScanSuccessSoundHelp$=Reproduce un sonido cuando el escaneo resalta correctamente uno o más objetos.

$HLO_SectionHotkeys$=Teclas de acceso rápido
$HLO_KBHotkeyLabel$=Tecla de acceso rápido del teclado
$HLO_KBHotkeyHelp$=Tecla del teclado o botón del ratón que resalta todos los objetos interactivos cercanos. Establece [NONE] para desactivarla.
$HLO_GPHotkeyLabel$=Tecla de acceso rápido del mando
$HLO_GPHotkeyHelp$=Botón del mando que resalta todos los objetos interactivos cercanos. Establece [NONE] para desactivarla.

$HLO_SectionFilter$=Filtros globales
$HLO_filterHelp1$=Formularios (referencias u objetos base) añadidos a:
$HLO_filterHelp2$=HLOWhiteList (HighlightObjects.esp|0x881) :\nSiempre se resaltan. Tiene prioridad sobre todos los filtros.
$HLO_filterHelp3$=HLOBlackList (HighlightObjects.esp|0x880) :\nNunca se resaltan.
$HLO_filterHelp4$=HLOWhiteList tiene prioridad sobre HLOBlackList.\nAmbas listas son dinámicas y pueden modificarse con cualquier herramienta que manipule FormLists (p. ej., un plugin, FormList Manipulator, SkyPatcher o un script de Papyrus).
$HLO_IgnoreUnnamedCheckBox$=Ignorar todos los objetos sin nombre
$HLO_IgnoreUnnamedHelp$=Al activarlo, los objetos que no tengan un nombre visible no se resaltarán. Esto excluye activadores, mobiliario, puertas y otros objetos sin nombre.

$HLO_SectionCategories$=Categorías de resaltado
$HLO_CatActivator$=Activador
$HLO_CatTalkingActivator$=Activador de diálogo
$HLO_CatContainer$=Contenedor
$HLO_CatContainerHelp$=Incluye montones de ceniza y otros restos que se pueden saquear.
$HLO_minimumValueWeightRatioDrag$=Relación mínima valor/peso
$HLO_minimumValueWeightRatioHelp$=Solo resalta los contenedores que contienen al menos un objeto cuya relación entre valor y peso sea igual o superior a este umbral. Los objetos con peso cero y valor superior a 0 (como el oro o las ganzúas) siempre se consideran válidos. Establece 0 para desactivar este filtro.
$HLO_ignoreEmptyContainersCheckBox$=Ignorar contenedores vacíos
$HLO_CatDoor$=Puerta
$HLO_CatFlora$=Flora
$HLO_CatFurniture$=Mobiliario
$HLO_CatArmor$=Armadura
$HLO_CatWeapon$=Arma
$HLO_CatAmmo$=Munición
$HLO_CatBook$=Libro
$HLO_IgnoreReadCheckBox$=Ignorar libros leídos
$HLO_IgnoreKnownSpellsCheckBox$=Ignorar hechizos conocidos
$HLO_CatIngredient$=Ingrediente
$HLO_CatKeyMaster$=Llave
$HLO_CatMisc$=Varios
$HLO_CatAlchemyItem$=Poción / Veneno
$HLO_CatScroll$=Pergamino
$HLO_CatSoulGem$=Gema del alma

$HLO_SectionColor$=Color del efecto
$HLO_colorRedSlider$=Rojo
$HLO_colorGreenSlider$=Verde
$HLO_colorBlueSlider$=Azul
$HLO_highlightStrengthSlider$=Intensidad del resaltado
$HLO_highlightStrengthHelp$=Controla qué proporción del objeto queda cubierta por el resaltado. Los valores más bajos crean un contorno más fino.

$HLO_SectionDebug$=Depuración
$HLO_DebugCheckbox$=Depuración
$HLO_DebugHelp$=Activa información detallada en el registro para facilitar la resolución de problemas.

$HLO_DiscardChangesButton$=Descartar cambios
$HLO_DiscardChangesHelp$=Descarta todos los cambios sin guardar y restaura la última configuración guardada.
$HLO_RestoreDefaultsButton$=Restaurar valores predeterminados
$HLO_RestoreDefaultsHelp$=Restaura todos los ajustes a sus valores predeterminados.