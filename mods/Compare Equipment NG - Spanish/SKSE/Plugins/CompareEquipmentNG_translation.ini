[Customization]

#Desplazamiento de los valores de diferencia respecto a los valores normales, por defecto 0
diffOffset = 0

#Desplazamiento de los valores respecto a las etiquetas, por defecto 0
valueOffset = 2

#Desplazamiento de la segunda columna de etiquetas, por defecto 155
columnTwoOffset = 155


[Translations]

#Este ini tambien se recarga con los ajustes en el juego.
#Todo el texto debe ser compatible con el html basico que soporta ActionScript 2.0 (siempre que la fuente en el SWF lo permita).
#Reemplaza el texto despues del "=" a continuacion:

#Texto de ayuda que se muestra en el menu QuickLoot.
#Establece uno de estos si usas Oblivion Interaction Icons:
# Usa EE o EhE ya que EE puede verse un poco sospechoso: <font face='Daedric'>EE</font>
# Usa P o lo que quieras de Oblivion Interaction Icons Docs/OII_cheatsheet.png: <font face=' Iconographia'>P</font>
# Tamano de fuente 22 es el que hace que el simbolo de tecla rapida tenga el tamano correcto para mi, el tuyo puede ser diferente: <font face = 'SkyrimBooks_Handwritten_Bold' size = '22'><b>[][]</b></font> 
QuickLoot IE Hint Text = Comparar

# Texto que se muestra junto al boton de ayuda
buttonCompareText = Comparar

# El objeto se esta comparando con el equipo de x
comparingTo = <font color="#D4D4D4" size="12">Comparando con</font>

# Daño del arma, ejemplo -> "Daño:" 10.00
damageLabelText = <font color="#D4D4D4" size="12">Daño:</font>

# Daño critico del arma, ejemplo -> "Crit:" 4.00
critLabelText = <font color="#D4D4D4" size="12">Crit:</font>

# Indica sin efectos o sin valor
noneText = Ninguno

# Tipo de armadura del objeto, ejemplo -> "Tipo de armadura:" Tela
armorTypeLabelText = <font color="#D4D4D4" size="12">Tipo de armadura:</font>

# Tipo de armadura: Pesada
heavyArmor = Pesada

# Tipo de armadura: Ligera
lightArmor = Ligera

# Tipo de armadura: Tela
clothArmor = Tela

# Indice o defensa de la armadura, ejemplo -> "Indice de armadura:" 20
armorRatingLabelText = <font color="#D4D4D4" size="12">Indice de armadura:</font>

# Cuanto vale el objeto en oro, ejemplo -> "Valor en oro:" 1000
goldLabelText = <font color="#D4D4D4" size="12">Valor en oro:</font>

# Encantamiento, efecto o descripcion del objeto
effectsLabelText = <font color="#D4D4D4" size="12">Efecto(s):</font>

# El objeto esta "Equipado a" x actor
equippedTo = <font color="#D4D4D4" size="12">Equipado a</font>

# Espacio o espacios del cuerpo que ocupa el objeto
slotsLabelText = <font color="#D4D4D4" size="12">Espacio(s):</font>

# Mano a la que esta equipada el arma: izquierda
leftHand = Mano izquierda

# Mano a la que esta equipada el arma: derecha
rightHand = Mano derecha

# Mano(s) a la que esta equipada el arma: ambas
bothHands = Ambas manos

# Velocidad a la que ataca un arma.
speedLabelText = <font color="#D4D4D4" size="12">Velocidad:</font>

# Alcance de un arma al atacar.
reachLabelText = <font color="#D4D4D4" size="12">Alcance:</font>

# Daño de tambaleo que causa un arma al enemigo.
staggerLabelText = <font color="#D4D4D4" size="12">Tambaleo:</font>

# Leyenda o clave que explica las diferencias relativas
keyText = <font color="#D4D4D4" size="12">Clave:</font>

# La clave en si. Diferencia total, promedio, maxima.
keyInfo = (Total : T, Promedio : A, Max : M)

# Indicador de la clave anterior -> (T)otal: (T), para anadir un espacio pon un punto y coma delante ';T'
totalKey = T

# Indicador de la clave anterior -> (A)verage: (A), para anadir un espacio pon un punto y coma delante ';A'
averageKey = A

# Indicador de la clave anterior -> (M)ax: (M), para anadir un espacio pon un punto y coma delante ';M'
maxKey = M

# Texto simple que indica que no aplica o no esta disponible
notApplicable = N/D

# Inicio del envoltorio HTML para mejor #RRGGBB asi un verde (+Dif)
betterWrapperStart = <font color="#00FF00">(+

# Fin del envoltorio HTML mejor
betterWrapperEnd = )</font>

# Inicio del envoltorio HTML para peor #RRGGBB asi un rojo (Dif)
worseWrapperStart = <font color="#FF0000">(

# Fin del envoltorio HTML peor
worseWrapperEnd = )</font>

# Inicio del envoltorio HTML normal para texto normal como el "32" en Indice de armadura: 32 en blanco
normalWrapperStart = <font color="#FFFFFF">

# Fin del envoltorio HTML normal
normalWrapperEnd = </font>

# Notificacion que aparece cuando recargas los ajustes con la tecla rapida
settingsReloaded = CompareEquipmentNG: Ajustes recargados