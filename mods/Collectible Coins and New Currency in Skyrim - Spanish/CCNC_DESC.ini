0x001~CCNC.esp|Corona de Daggerfall acuñada durante el reinado del rey Bergamot Deleyn. Solo tiene valor para coleccionistas e historiadores.
0x007~CCNC.esp|Corona de Wayrest acuñada durante el reinado del rey Farangel Gardner. Solo tiene valor para coleccionistas e historiadores.
0x008~CCNC.esp|Corona de Camlorn acuñada durante el reinado del duque Sebastien Rielle. Solo tiene valor para coleccionistas e historiadores.
0x009~CCNC.esp|Corona de Shornhelm acuñada durante el gobierno del triunvirato. Solo tiene valor para coleccionistas e historiadores.
0x00A~CCNC.esp|Corona de Evermore acuñada durante el reinado del rey Eamond Guimard. También llamada "Oro de la Vanguardia". Solo tiene valor para coleccionistas e historiadores.
0x00B~CCNC.esp|Corona de Northpoint acuñada durante el reinado del barón Alard Dorell. Solo tiene valor para historiadores y algunos nobles de Soledad o Ventalia.
0x00C~CCNC.esp|Corona de Farrun acuñada justo después de conquistar la fortaleza de Fharun. Tiene cierto valor para historiadores y algunos nobles de Soledad. Es una reliquia valiosa para los orcos de Wrothgar.
0x00D~CCNC.esp|Corona de Jehanna acuñada durante el reinado del primer rey de Jehanna. Solo tiene valor para historiadores, nobles de Soledad y bretones adinerados.
0x00F~CCNC.esp|Corona del Pacto acuñada en Wayrest durante el reinado del Gran Rey Emeric. Solo tiene valor para coleccionistas e historiadores.
0x010~CCNC.esp|Moneda antigua de la Hegemonía Direnni acuñada durante el reinado de Aidan Direnni. También llamada "Hegemón". Muy valiosa para los magos como catalizador mágico.
0x011~CCNC.esp|Utilizada por el Primer Orsinium para comerciar con los forasteros. También llamada "Osh-Ghar". Para muchos orcos, es un símbolo del antiguo poder económico de su pueblo.
0x012~CCNC.esp|Moneda utilizada por los orcos de las fortalezas, aunque en general la mayoría de los orcos la aceptan. Fabricada con hierro rudimentario con trazas de oricalco.
0x013~CCNC.esp|Moneda guardia roja nombrada en honor a la nobleza yokudana, acuñada por los Coronas tradicionalistas y aislacionistas. Solo tiene valor para coleccionistas e historiadores.
0x016~CCNC.esp|Moneda guardia roja acuñada por los Antepasados cosmopolitas y de mente abierta. Solo tiene valor para coleccionistas e historiadores.
0x017~CCNC.esp|Moneda unificada de Páramo del Martillo. Oficialmente llamada "Ra Gada", en honor a las "Olas Guerreras" yokudanas, como provocación tanto hacia los elfos como hacia el débil Imperio.
0x018~CCNC.esp|Moneda del Segundo Imperio. Solo tiene valor para oficiales imperiales y los Ojos de Penitus.
0x01B~CCNC.esp|Parece una moneda alesiana, pero en realidad es un artefacto religioso falsificado fabricado por la Orden Alesiana. Solo tiene valor para historiadores.
0x01C~CCNC.esp|Una moneda dañada bañada en oro. Un artefacto religioso falsificado fabricado por la Orden Alesiana. Solo tiene valor para historiadores.
0x01D~CCNC.esp|También llamada "moneda del tributo de Lirulorne". Un puñado de estas monedas fue entregado al semidiós Morihaus. Es la moneda más rara de Tamriel.
0x01E~CCNC.esp|Abreviatura de "Ja'zennji Siir", que significa "luz de Jode" en ta'agra. Moneda de Elsweyr como estado vasallo del Dominio de Aldmer.
0x01F~CCNC.esp|Variante de Ja'zenn. Tiene la imagen de un Senche-Raht rugiendo en lugar de la del Mane.
0x021~CCNC.esp|Moneda altmer antigua. También llamada "oro solar". Oro de gran pureza refinado mediante magia élfica. Valiosa para los magos como catalizador mágico.
0x0F8~CCNC.esp|Moneda altmer acuñada durante el reinado de la reina suprema Ayrenn. Oro de gran pureza refinado mediante magia élfica. Valiosa para los magos como catalizador mágico.
0x022~CCNC.esp|Amuleto que antiguamente se entregaba a quienes completaban una peregrinación. La mayoría de los dunmer los consideran reliquias familiares, mientras que el Nuevo Templo preferiría verlos destruidos.
0x023~CCNC.esp|Amuleto que antiguamente se entregaba a quienes completaban una peregrinación. La mayoría de los dunmer los consideran reliquias familiares, mientras que el Nuevo Templo preferiría verlos destruidos.
0x024~CCNC.esp|Amuleto que antiguamente se entregaba a quienes completaban una peregrinación. La mayoría de los dunmer los consideran reliquias familiares, mientras que el Nuevo Templo preferiría verlos destruidos.
0x025~CCNC.esp|Intento de una facción de la Casa Redoran por monopolizar una nueva moneda, pero terminó en fracaso. Muchas de estas monedas están esparcidas por las tierras de Redoran.
