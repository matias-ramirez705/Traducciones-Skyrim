; original septim. Weight has to be 0. Value has to be 1.
filterByMiscs= skyrim.esm|0xf:value=1:weight=0:fullName=~Septim~

; copper septim. Value has to be 1.
filterByMiscs= exchangeCurrency_enhanced.esp|0xb6d:value=1:weight=0.01:fullName=~Septim de Cobre~

; silver septim
filterByMiscs= exchangeCurrency_enhanced.esp|0x823:value=25:weight=0.02:fullName=~Septim de Plata~

; gold septim
filterByMiscs= exchangeCurrency_enhanced.esp|0x824:value=100:weight=0.03:fullName=~Septim de Oro~

; This instance must have the same fullname as the "Septim" instance, but in the plural form.
filterByMiscs= exchangeCurrency_enhanced.esp|0xbd2:fullName=~Septims~

; This instance must have the same fullname as the "Copper Septim" instance, but in the plural form.
filterByMiscs= exchangeCurrency_enhanced.esp|0xbd0:fullName=~Septim de Cobre~

; This instance must have the same fullname as the "Silver Septim" instance, but in the plural form.
filterByMiscs= exchangeCurrency_enhanced.esp|0xbcf:fullName=~Septim de Plata~

; This instance must have the same fullname as the "Gold Septim" instance, but in the plural form.
filterByMiscs= exchangeCurrency_enhanced.esp|0xbd1:fullName=~Septim de Oro~




