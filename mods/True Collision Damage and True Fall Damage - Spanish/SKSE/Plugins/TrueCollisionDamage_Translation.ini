[Strings]
ModName = Daño por colisión real
SettingsLabel = Configuración
DebugCheckbox = Modo de depuración
DebugHelp = Activa el registro detallado en el archivo de registro de SKSE para la solución de problemas.
DamageSection = --- Daño ---
FatalVelocity = Velocidad letal
FatalVelocityHelp = Velocidad de impacto que inflige el 110% de la salud máxima como daño (base para el %% de salud máxima). Menor = más daño por colisiones.
FatalHeight = Altura letal
FatalHeightHelp = Altura de caída que añade el 110% de la salud máxima como daño por impacto contra el suelo (base para el %% de salud máxima). Menor = más daño por altura.
CurveSection = --- Curva de daño ---
WallDamageExponent = Exponente de daño contra paredes
WallDamageExponentHelp = Mayor = MÁS daño contra paredes, menor = MENOS. Por defecto 1.0. El daño letal nunca se ve afectado.
FloorDamageExponent = Exponente de daño contra el suelo
FloorDamageExponentHelp = Mayor = MÁS daño contra el suelo, menor = MENOS. Por defecto 1.0. El daño letal nunca se ve afectado.
DetectionSection = --- Detección ---
AirborneThreshold = Umbral en el aire
AirborneThresholdHelp = Distancia al suelo por raycast a partir de la cual un actor se considera en el aire y se registra para daño por colisión.
RaycastSection = --- Raycast ---
FloorRaycastLen = Distancia del Raycast de Suelo
FloorRaycastLenHelp = Distancia en unidades para el raycast de detección del suelo. Los valores más bajos mejoran el rendimiento, pero reducen el alcance de detección. 1-10000, predeterminado: 2000.
WallRaycastLen = Distancia del Raycast de Pared
WallRaycastLenHelp = Distancia en unidades para el raycast de detección de paredes. Los valores más bajos mejoran el rendimiento, pero reducen el alcance de detección. 1-10000, predeterminado: 2000.
MaxTrackedActors = Máximo de Actores Rastreados
MaxTrackedActorsHelp = Número máximo de actores con seguimiento de colisión activo. Los valores más bajos mejoran el rendimiento, pero reducen la cantidad de actores con seguimiento de colisión activo.
ExperimentalSection = --- Experimental ---
PlayerEnabled = Activar daño por colisión para el jugador
PlayerEnabledHelp = Al activarse, el jugador puede recibir daño por colisión contra suelos y paredes. ADVERTENCIA: Activar esto puede causar daño no intencionado por movimientos extraños del jugador, habilidades de deslizamiento (Señor Vampiro), movimiento modificado o terreno irregular.
BlacklistSection = --- Lista negra ---
BlacklistHelp = Agrega nombres o IDs de editor para excluir enemigos del daño por colisión. Coincidencia parcial sin distinguir mayúsculas/minúsculas contra el nombre del actor y el ID de editor.
BlacklistInputLabel = Nombre/ID de editor en lista negra
BlacklistInputHelp = Escribe un nombre o ID de editor parcial o exacto y haz clic en Guardar. Los enemigos coincidentes serán excluidos de todo daño por colisión.
BlacklistSaveButton = Guardar
DeleteBlacklistHelp = Elimina esta entrada de la lista negra
